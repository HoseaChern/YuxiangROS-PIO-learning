; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; 公共配置: 所有环境共享的构建选项
;
; lib_deps: 经逐环境分析各源码的实际 #include, 不存在被"所有环境"共同使用的
; 第三方库 (最大公因数 = 空集):
;   - Esp32McpwmMotor / Esp32PcntEncoder -> 仅主环境 / test01_motor / test02_encoder
;   - micro_ros_platformio               -> 主环境 + test06_wifi
;   - MPU6050_light                      -> 仅 example04
; 因此 lib_deps 不放在公共段, 由各环境按需单独声明。
; 每个环境的 .pio/libdeps/<env> 相互独立, 环境只声明自己需要的库, 就不会
; 安装/编译多余的库, 无需 lib_ignore。
;
; 注意: micro_ros_platformio 的 extra_script.py 构建钩子在其被安装的环境
;       无条件执行 (注入 MICRO_ROS 宏、链接预编译 libmicroros), 无法用
;       lib_ignore 阻止, 因此它必须只声明在使用它的环境 (主环境/test06_wifi)。
; ============================================================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- IntelliSense 专用 include 路径 (不影响编译产物) ---
; MPU6050_light 只安装在 example04_IMU 环境的 libdeps 里, 而 IDE 的 IntelliSense
; 一次只能跟随"激活环境"生成 includePath (c_cpp_properties.json 由扩展自动生成)。
; 激活主环境时, example04 源码的 #include <MPU6050_light.h> 会报"无法打开源文件"。
; 此 -I 放在公共段对一切环境生效, 保证任何激活环境下 IntelliSense 都能解析该头。
; 编译层面多余但无害: 仅 example04 的源码 include 它, 其他环境不会误编译该库。
build_flags = 
    -I${PROJECT_DIR}/.pio/libdeps/example04_IMU/MPU6050_light/src

; ============================================================================
; 主固件: 运动控制 + micro-ROS
; 编译/烧录: pio run -e esp32-s3-devkitc-1 -t upload
; ============================================================================
[env:esp32-s3-devkitc-1]

; 排除所有示例/测试目录, 只编译主程序 src/main.cpp
; 否则 src/ 下多个 setup()/loop() 会导致符号重复定义, 链接失败
; 注: build_src_filter 会整体替换默认规则(默认是 +<*> -<example> -<test> ...),
;     因此"包含所有"的 +<*> 必须显式写出, 否则连 src/main.cpp 也会被排除
build_src_filter = +<*> -<examples> -<tests>

board_microros_transport = wifi
; 本环境需要的第三方库 (公共段无 lib_deps, 环境级声明不依赖任何继承)
lib_deps = 
    https://github.com/fishros/Esp32McpwmMotor.git
    https://github.com/fishros/Esp32PcntEncoder.git
    ; 官方 micro_ros_platformio 有 bug 且未修复
    ; 此为鱼香ROS的预编译镜像版本
    https://github.com/fishros/micro_ros_platformio.git

; ============================================================================
; 示例环境: 每个只编译 src/examples/example0X_xxx/main.cpp, 与主固件互不干扰
; ============================================================================
[env:example01_helloworld]
build_src_filter = +<examples/example01_helloworld>

[env:example02_LED]
build_src_filter = +<examples/example02_LED>

[env:example03_Ultrasound]
build_src_filter = +<examples/example03_Ultrasound>

[env:example04_IMU]
build_src_filter = +<examples/example04_IMU>
; 本环境只需要 MPU6050_light (Wire 为 Arduino 内置)
lib_deps = 
    https://github.com/rfetick/MPU6050_light.git

; ============================================================================
; 测试固件: 只编译 src/tests/testXX_xxx/main.cpp, 与主固件互不干扰
; 注意: test04/test05/test07 当前为预留空目录, 尚未配置对应环境;
;       写入代码后请在下方新增 [env:testXX_xxx] 并设置 build_src_filter。
; ============================================================================

; ---- test01: 电机驱动测试 ----
; 编译/烧录: pio run -e test01_motor -t upload
[env:test01_motor]
build_src_filter = +<tests/test01_motor>
lib_deps = 
    https://github.com/fishros/Esp32McpwmMotor.git

; ---- test02: 编码器测试 ----
; 功能: 读取两路编码器 tick, 并换算成单个脉冲对应的轮子前近距离
; 编译/烧录: pio run -e test02_encoder -t upload
[env:test02_encoder]
build_src_filter = +<tests/test02_encoder>
lib_deps = 
    https://github.com/fishros/Esp32PcntEncoder.git

; ---- test03: 速度转换测试 ----
; 功能: 电机定速运行, 根据编码器差值与标定参数计算当前速度 (m/s)
; 编译/烧录: pio run -e test03_speed_trans -t upload
[env:test03_speed_trans]
build_src_filter = +<tests/test03_speed_trans>
lib_deps = 
    https://github.com/fishros/Esp32McpwmMotor.git
    https://github.com/fishros/Esp32PcntEncoder.git

; ---- test06: 网络连接测试 ----
; 编译/烧录: pio run -e test06_wifi -t upload
[env:test06_wifi]
build_src_filter = +<tests/test06_wifi>
board_microros_transport = wifi
; 只声明本环境用到的 micro_ros, 不涉及电机/编码器/IMU
lib_deps = 
    https://github.com/fishros/micro_ros_platformio.git
