; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; 公共配置: 所有环境共享的构建选项
;
; 第三方库已本地化: 4 个第三方库 (Esp32McpwmMotor / Esp32PcntEncoder /
; MPU6050_light / micro_ros_platformio)
; 各环境共享同一份源码 (保留各库 .git 以追溯上游, 目录被 .gitignore 忽略不入库)
; 因此不再需要环境级 lib_deps, 各环境按源码实际 #include 自动编译所需库
;
; lib_ignore = micro_ros_platformio: 默认对所有环境忽略 micro-ROS 库
; 其 extra_script.py 构建钩子 (注入 MICRO_ROS 宏、链接预编译 libmicroros) 只应
; 在真正使用 micro-ROS 的环境执行, 否则会污染非 micro-ROS 环境的构建;
; 使用 micro-ROS 的环境 (主环境 / test06 / test07 / test08) 用空 lib_ignore 覆盖解除忽略。
; ============================================================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 默认忽略 micro-ROS 库 (见上方注释), 使用它的环境单独覆盖解除
lib_ignore = micro_ros_platformio

; --- IntelliSense 专用 include 路径 (不影响编译产物) ---
; MPU6050_light 现位于 lib/MPU6050_light, 但 IDE 的 IntelliSense 一次只能跟随
; "激活环境"生成 includePath (c_cpp_properties.json 由扩展自动生成)。激活不使用
; IMU 的环境时, 这些源码的 #include <MPU6050_light.h> 会报"无法打开源文件"。
; 此 -I 放在公共段对一切环境生效, 保证任何激活环境下 IntelliSense 都能解析该头。
; 编译层面多余但无害: 仅这些环境的源码 include 它, 其他环境不会误编译该库。
build_flags = 
    -I${PROJECT_DIR}/lib/MPU6050_light/src

; ============================================================================
; 主固件: 运动控制 + micro-ROS
; 编译/烧录: pio run -e esp32-s3-devkitc-1 -t upload
; ============================================================================
[env:esp32-s3-devkitc-1]

; 排除所有示例/测试目录, 只编译主程序 src/main.cpp
; 否则 src/ 下多个 setup()/loop() 会导致符号重复定义, 链接失败
; 注: build_src_filter 会整体替换默认规则(默认是 +<*> -<example> -<test> ...),
;     因此"包含所有"的 +<*> 必须显式写出, 否则连 src/main.cpp 也会被排除
build_src_filter = +<*> -<examples> -<tests>

board_microros_transport = wifi
; 使用 micro-ROS: 覆盖公共段 lib_ignore, 解除对 micro_ros_platformio 的忽略
lib_ignore = 

; ============================================================================
; 示例环境: 每个只编译 src/examples/example0X_xxx/main.cpp, 与主固件互不干扰
; ============================================================================
[env:example01_helloworld]
build_src_filter = +<examples/example01_helloworld>

[env:example02_LED]
build_src_filter = +<examples/example02_LED>

[env:example03_Ultrasound]
build_src_filter = +<examples/example03_Ultrasound>

[env:example04_IMU]
build_src_filter = +<examples/example04_IMU>

; ============================================================================
; 测试固件: 只编译 src/tests/testXX_xxx/main.cpp, 与主固件互不干扰
; 注意: test04/test05/test07 当前为预留空目录, 尚未配置对应环境;
;       写入代码后请在下方新增 [env:testXX_xxx] 并设置 build_src_filter。
; ============================================================================

